short_bio: >-
  <p>
    I recently received my master's degree in applied mathematics from National Yang Ming Chiao Tung University (NYCU),
    where I worked on combinatorics and matroid theory under the supervision of Prof. Chi Ho Yuen.
  </p>
  <p>
    I will soon join the Institute of Information Science (IIS), Academia Sinica, as an R&amp;D Substitute Service researcher.
    Alongside my continuing interest in matroid theory, I am interested in exploring programming languages,
    type theory, and semantics.
  </p>
  <p class="mb-0">
    <strong>Research perspective:</strong> I am interested in how local combinatorial data can force global algebraic
    or geometric structure.
  </p>

research_interests:
  - name: Matroid Theory
    details: White's conjecture, paving and split matroids, relaxation operations, and matroid toric ideals
  - name: Realization Spaces
    details: phased matroids, rigidity phenomena, and Grassmannian strata
  - name: Topics I Hope to Explore
    details: homotopy type theory, programming language semantics, and algebraic geometry


{% assign news_by_year = site.news | sort: "date" | reverse | slice: 0, include.limit | group_by_exp: "item", "item.date | date: '%Y'" %}
<section class="{% if include.embedded %}profile-news card border-0 shadow-sm bg-white mt-3{% else %}my-3 bg-white shadow-sm rounded-xl{% endif %}" aria-labelledby="news-title">
  <h2 id="news-title" class="h6 p-3 mb-0 border-bottom border-gray"><i class="fas fa-rss"></i> News</h2>
  <div class="profile-news-scroll px-3 py-2 small" tabindex="0" aria-label="News updates">
    {% for year in news_by_year %}
    <div class="news-year {% unless forloop.first %}border-top border-gray{% endunless %}">
      <div class="news-year-label">{{ year.name }}</div>
      <div class="news-year-items">
        {% for item in year.items %}
        <article class="news-item">
          <div>{{ item.title }}</div>
          <time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%b %d" }}</time>
        </article>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>

{% assign publications = include.publications %}
<section class="my-3 p-0 bg-white shadow-sm rounded-xl">
  <h2 class="h6 border-bottom border-gray p-3 mb-0"><i class="fas fa-star"></i> {{ include.title | default: "Selected Publications" }} <a href="{{ '/publications' | relative_url }}">(view all <i class="fas fa-angle-double-right"></i>)</a></h2>
  {% for item in publications %}{% include widgets/publication_item.html item=item %}{% endfor %}
</section>

{% assign item = include.item %}
<article class="publication-item p-3 {% unless include.hide_bottom_border %}border-bottom border-gray{% endunless %}">
  <div class="row">
    <div class="col-md-3 col-xl-2 mb-3 mb-md-0">
      <div class="publication-mark" aria-hidden="true"><i class="fas fa-diagram-project"></i></div>
    </div>
    <div class="col-md-9 col-xl-10">
      <h3 class="h5 mt-0 mb-1 font-weight-normal">{{ item.title }}</h3>
      <p class="mt-0 mb-0 small">{% include widgets/author_list.html authors=item.authors %}</p>
      <p class="mt-0 mb-0 small"><i>{{ item.pub }}</i>{% if item.pub_date %}, {{ item.pub_date }}{% endif %}</p>
      <p class="mt-1 mb-0 small text-muted">{{ item.abstract }}</p>
      <p class="small mb-0 abstract-links">{% for link in item.links %}<a target="_blank" rel="noopener" href="{{ link[1] }}">[{{ link[0] }}]</a> {% endfor %}</p>
    </div>
  </div>
</article>
